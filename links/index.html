<meta charset="UTF-8" />

<title>Tennis Custom — Links</title>

<link rel="icon" type="image/svg+xml" href="../favicon.svg" />

<meta property="og:url" content="https://tenniscustom.app/links" />

<style>
  :root {
    --bg: #0B1320; --surface: #1E293B; --primary: #38BDF8;
    --text: #F1F5F9; --text-dim: #94A3B8;
    --border: rgba(56, 189, 248, 0.14); --border-soft: rgba(255, 255, 255, 0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(ellipse 90% 40% at 50% 0%, rgba(56, 189, 248, 0.14), transparent 65%);
    pointer-events: none; z-index: 0;
  }
  .wrap { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 48px 24px 40px; }
  .top { text-align: center; margin-bottom: 36px; }
  .logo { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 20px; text-decoration: none; }
  .logo-mark {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, #38BDF8 0%, #0EA5E9 100%);
    box-shadow: 0 0 28px rgba(56, 189, 248, 0.45);
    display: grid; place-items: center; color: #0B1320;
    font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 22px;
  }
  .logo-name { font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px; color: var(--text); letter-spacing: -0.01em; }
  .tagline { font-size: 15px; color: var(--text-dim); max-width: 340px; margin: 0 auto; }
  .download {
    background: linear-gradient(180deg, rgba(56,189,248,0.06), rgba(56,189,248,0.02));
    border: 1px solid var(--border); border-radius: 20px; padding: 24px 20px; margin-bottom: 36px;
  }
  .download-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--primary); text-align: center; margin-bottom: 18px;
  }
  .store-buttons { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .store-btn { display: inline-flex; transition: transform 0.2s; text-decoration: none; }
  .store-btn:hover { transform: translateY(-2px); }
  .store-btn img { height: 52px; display: block; }
  .store-btn.featured { order: -1; }
  .store-btn.featured img { height: 62px; }
  .store-btn.demoted img { height: 46px; opacity: 0.92; }
  .divider { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border-soft); }
  .divider span {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .partners { display: flex; flex-direction: column; gap: 14px; margin-bottom: 40px; }
  .partner {
    display: block; background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: 16px; overflow: hidden; text-decoration: none;
    transition: border-color 0.2s, transform 0.2s;
  }
  .partner:hover { border-color: var(--border); transform: translateY(-1px); }
  .partner-logo { width: 100%; height: 92px; object-fit: cover; display: block; }
  .partner-foot { padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .partner-desc { font-size: 13.5px; color: var(--text-dim); }
  .partner-foot .arrow { color: var(--primary); font-family: 'IBM Plex Mono', monospace; font-size: 16px; flex-shrink: 0; }
  .footer { text-align: center; }
  .footer a {
    font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--primary);
    text-decoration: none; letter-spacing: 0.02em;
  }
  .footer a:hover { text-decoration: underline; }
  .signature {
    margin-top: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    letter-spacing: 0.22em; color: var(--text-dim); text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a href="/" class="logo">
        <span class="logo-mark">T</span>
        <span class="logo-name">Tennis Custom</span>
      </a>
      <p class="tagline">Calcule o efeito de chumbo, cordas e acessórios na sua raquete.</p>
    </div>

    <div class="download">
      <div class="download-label">Baixe o app</div>
      <div class="store-buttons" id="store-buttons">
        <a id="apple-btn" href="https://apps.apple.com/app/apple-store/id6761192994?pt=128635517&ct=meta_wimbledon_appstore&mt=8" target="_blank" rel="noopener" class="store-btn" aria-label="Baixar na App Store" data-store="apple">
          <img src="https://developer.apple.com/app-store/marketing/guidelines/images/badge-download-on-the-app-store.svg" alt="Baixar na App Store" />
        </a>
        <a id="google-btn" href="https://play.google.com/store/apps/details?id=com.tenniscustom.app&referrer=utm_source%3Dsite%26utm_medium%3Dbio%26utm_campaign%3Dlinks" target="_blank" rel="noopener" class="store-btn" aria-label="Disponível no Google Play" data-store="google">
          <img src="../screens/google-play-badge.svg" alt="Disponível no Google Play" />
        </a>
      </div>
    </div>

    <div class="divider"><span>Parceiros</span></div>

    <div class="partners">
      <a href="https://toroline.com.br" target="_blank" rel="noopener" class="partner">
        <img src="./logos/toroline.png" alt="Toroline Brasil" class="partner-logo" />
        <div class="partner-foot">
          <span class="partner-desc">Cordas usadas no Tennis Custom LAB</span>
          <span class="arrow">&rarr;</span>
        </div>
      </a>
      <a href="https://www.grandslamart.com.br" target="_blank" rel="noopener" class="partner">
        <img src="./logos/grandslam.png" alt="Grand Slam Art" class="partner-logo" />
        <div class="partner-foot">
          <span class="partner-desc">Quadros e expositores para quem vive o tênis</span>
          <span class="arrow">&rarr;</span>
        </div>
      </a>
      <a href="https://www.ersa-stringers.com.br" target="_blank" rel="noopener" class="partner">
        <img src="./logos/ersa.png" alt="ERSA South America" class="partner-logo" />
        <div class="partner-foot">
          <span class="partner-desc">Encordoamento e customização profissional</span>
          <span class="arrow">&rarr;</span>
        </div>
      </a>
    </div>

    <div class="footer">
      <a href="https://instagram.com/tennis.custom" target="_blank" rel="noopener">@tennis.custom</a>
      <div class="signature">Calcule. Ajuste. Compare.</div>
    </div>
  </div>

  <script>
    (function(){
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var apple = document.getElementById('apple-btn');
      var google = document.getElementById('google-btn');
      function isIOS() {
        if (/iPhone|iPod|iPad/.test(ua)) return true;
        if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
        return false;
      }
      function isAndroid() { return /android/i.test(ua); }
      if (isIOS()) { apple.classList.add('featured'); google.classList.add('demoted'); }
      else if (isAndroid()) { google.classList.add('featured'); apple.classList.add('demoted'); }
      function trackStore(store) {
        if (typeof fbq === 'function') {
          fbq('track', 'Lead', { content_name: store === 'apple' ? 'App Store click (links)' : 'Google Play click (links)' });
        }
      }
      apple.addEventListener('click', function(){ trackStore('apple'); });
      google.addEventListener('click', function(){ trackStore('google'); });
    })();
  </script>
</body>
</html>
